<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الحضور والأذونات</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --bg-color: #f4f7f6;
            --box-bg: #ffffff;
            --text-color: #333;
            --border-color: #ccc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: var(--box-bg);
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: var(--primary-color);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="date"], input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #004494;
        }
        .btn-export {
            background-color: #28a745;
            float: left;
        }
        .btn-export:hover {
            background-color: #218838;
        }
        .btn-delete {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 14px;
            margin: 0;
        }
        .btn-delete:hover {
            background-color: #c82333;
        }
        hr {
            border: 0;
            height: 1px;
            background: #eee;
            margin: 30px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid var(--border-color);
        }
        th, td {
            padding: 12px;
            text-align: right;
        }
        th {
            background-color: #f8f9fa;
        }
        .flex-row {
            display: flex;
            gap: 15px;
        }
        .flex-row .form-group {
            flex: 1;
        }
        @media (max-width: 600px) {
            .flex-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>نظام تسجيل أذونات وإجازات الفريق</h1>
    
    <form id="attendanceForm">
        <div class="flex-row">
            <div class="form-group">
                <label for="recordDate">التاريخ</label>
                <input type="date" id="recordDate" required>
            </div>
            <div class="form-group">
                <label for="employee">الموظف</label>
                <select id="employee" required>
                    <option value="">-- اختر الموظف --</option>
                </select>
            </div>
        </div>

        <div class="flex-row">
            <div class="form-group">
                <label for="permissionType">نوع الإذن / الإجازة</label>
                <select id="permissionType" required>
                    <option value="">-- اختر النوع --</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="notes">ملاحظات (اختياري)</label>
            <input type="text" id="notes" placeholder="اكتب أي ملاحظات هنا...">
        </div>

        <button type="submit">تسجيل البيانات</button>
    </form>

    <hr>

    <h2>سجل البيانات المحفوظة</h2>
    <button class="btn-export" onclick="exportToCSV()">تصدير إلى Excel (CSV)</button>
    <div style="clear: both;"></div>

    <div style="overflow-x: auto;">
        <table id="recordsTable">
            <thead>
                <tr>
                    <th>التاريخ</th>
                    <th>الاسم</th>
                    <th>الكود</th>
                    <th>نوع الإذن</th>
                    <th>ملاحظات</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>
</div>

<script>
    // بيانات الموظفين
    const employees = [
        { name: "Adham Omar Mohamed Mohamed", code: "16445" },
        { name: "Alaa AbdelWahab Sayed", code: "16215" },
        { name: "Asmaa Ashraaf", code: "17335" },
        { name: "Mahmoud Saleh Ibrahim Saleh", code: "16635" },
        { name: "Marehan Sayed Hanafi", code: "15110" },
        { name: "Nada Mohamed Shehata", code: "14540" },
        { name: "Amr Mohamed Nour", code: "15752" },
        { name: "Mahmoud Farag Mahmoud", code: "15180" },
        { name: "Mohamed Eid Sayed", code: "6273" },
        { name: "Mohammed Osama Syed Seif", code: "17405" },
        { name: "Nada Amr Hassan Abo Zayd", code: "17560" },
        { name: "Nehal Kamal Ahmed", code: "9602" },
        { name: "Sara Khalid Farid Elsayed", code: "14419" },
        { name: "Ahmed Alaa El din Hashem", code: "14415" },
        { name: "Passant Sayed Abdelmoneim", code: "14043" },
        { name: "Mohamed Ramadan Zehery", code: "15652" }
    ];

    // بيانات أنواع الأذونات
    const permissions = [
        "نصف يوم سنوي",
        "مرضي",
        "سنوي",
        "اذن حضور ساعتين",
        "اذن حضور ساعه",
        "اذن انصراف ساعه",
        "اذن انصراف ساعتين",
        "اجازة بدون إذن",
        "اجازة إذن",
        "مامورية",
        "عارضة"
    ];

    let records = [];

    // تهيئة الصفحة
    window.onload = function() {
        // تعيين تاريخ اليوم كافتراضي
        document.getElementById("recordDate").valueAsDate = new Date();

        // تعبئة قائمة الموظفين
        const employeeSelect = document.getElementById("employee");
        employees.forEach(emp => {
            let option = document.createElement("option");
            option.value = emp.code;
            option.textContent = `${emp.name} (${emp.code})`;
            employeeSelect.appendChild(option);
        });

        // تعبئة قائمة الأذونات
        const permissionSelect = document.getElementById("permissionType");
        permissions.forEach(perm => {
            let option = document.createElement("option");
            option.value = perm;
            option.textContent = perm;
            permissionSelect.appendChild(option);
        });

        // جلب البيانات المحفوظة مسبقاً
        loadData();
    };

    // حفظ البيانات
    document.getElementById("attendanceForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const date = document.getElementById("recordDate").value;
        const code = document.getElementById("employee").value;
        const employeeData = employees.find(emp => emp.code === code);
        const name = employeeData.name;
        const permission = document.getElementById("permissionType").value;
        const notes = document.getElementById("notes").value;

        const newRecord = {
            id: Date.now(),
            date: date,
            name: name,
            code: code,
            permission: permission,
            notes: notes
        };

        records.push(newRecord);
        saveData();
        renderTable();
        
        // مسح خانة الملاحظات بعد الإضافة
        document.getElementById("notes").value = "";
    });

    // حفظ في localStorage
    function saveData() {
        localStorage.setItem("attendanceRecords", JSON.stringify(records));
    }

    // استرجاع من localStorage
    function loadData() {
        const savedData = localStorage.getItem("attendanceRecords");
        if (savedData) {
            records = JSON.parse(savedData);
            renderTable();
        }
    }

    // عرض البيانات في الجدول
    function renderTable() {
        const tbody = document.querySelector("#recordsTable tbody");
        tbody.innerHTML = "";

        // عرض أحدث السجلات أولاً
        const reversedRecords = [...records].reverse();

        reversedRecords.forEach(record => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${record.date}</td>
                <td>${record.name}</td>
                <td>${record.code}</td>
                <td>${record.permission}</td>
                <td>${record.notes || "-"}</td>
                <td><button class="btn-delete" onclick="deleteRecord(${record.id})">حذف</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // حذف سجل
    function deleteRecord(id) {
        if(confirm("هل أنت متأكد من حذف هذا السجل؟")) {
            records = records.filter(record => record.id !== id);
            saveData();
            renderTable();
        }
    }

    // التصدير إلى Excel (CSV)
    function exportToCSV() {
        if (records.length === 0) {
            alert("لا توجد بيانات لتصديرها.");
            return;
        }

        let csvContent = "التاريخ,الاسم,الكود,نوع الإذن,ملاحظات\n";

        records.forEach(record => {
            // تنظيف الملاحظات من الفواصل لتجنب أخطاء الـ CSV
            const safeNotes = record.notes ? `"${record.notes.replace(/"/g, '""')}"` : "";
            const row = `"${record.date}","${record.name}","${record.code}","${record.permission}",${safeNotes}`;
            csvContent += row + "\n";
        });

        // إضافة BOM لدعم الحروف العربية في Excel
        const bom = "\uFEFF";
        const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        
        const link = document.createElement("a");
        link.href = url;
        const today = new Date().toISOString().split('T')[0];
        link.download = `attendance_export_${today}.csv`;
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
