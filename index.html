<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة التيكتات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .page { display: none; }
        .active { display: block; }
    </style>
</head>
<body class="bg-gray-50">

    <div id="loginPage" class="page active min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border">
            <h2 class="text-2xl font-bold text-center mb-6 text-blue-700">دخول الموظفين</h2>
            <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" class="w-full p-3 mb-4 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="password" id="loginPass" placeholder="كلمة المرور" class="w-full p-3 mb-6 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">تسجيل الدخول</button>
        </div>
    </div>

    <div id="mainPage" class="page">
        <nav class="bg-white shadow-sm p-4 flex justify-between items-center px-8 border-b">
            <h1 class="text-xl font-bold text-blue-800">سيستم التيكتات</h1>
            <div class="flex items-center gap-4">
                <span id="userDisp" class="text-gray-600 text-sm"></span>
                <button onclick="handleLogout()" class="text-red-500 text-sm font-bold border border-red-200 px-3 py-1 rounded hover:bg-red-50">خروج</button>
            </div>
        </nav>

        <div class="container mx-auto p-4 md:p-8 grid md:grid-cols-2 gap-8">
            
            <div class="bg-white p-6 rounded-xl shadow-sm border">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <span class="bg-blue-100 text-blue-600 p-2 rounded-full">📝</span> إنشاء تيكت جديد
                </h2>
                
                <div class="space-y-4">
                    <div class="flex gap-2 p-1 bg-gray-100 rounded-lg">
                        <button id="btnNew" onclick="setCategory('طلب جديد')" class="flex-1 p-2 rounded-md font-bold transition bg-white shadow-sm text-blue-600">طلب جديد</button>
                        <button id="btnInq" onclick="setCategory('استفسار')" class="flex-1 p-2 rounded-md font-bold transition text-gray-500">استفسار</button>
                    </div>

                    <input type="tel" id="custMobile" placeholder="رقم موبايل العميل" class="w-full p-3 border rounded-lg outline-none focus:border-blue-500">
                    
                    <select id="subCat" class="w-full p-3 border rounded-lg outline-none">
                        <option value="طلب جديد">نوع الطلب: جديد</option>
                        <option value="متابعة">نوع الطلب: متابعة</option>
                        <option value="تعديل">نوع الطلب: تعديل</option>
                    </select>

                    <select id="branch" class="w-full p-3 border rounded-lg outline-none">
                        <option value="بازوكا">فرع بازوكا</option>
                        <option value="ماك">فرع ماك</option>
                    </select>

                    <textarea id="desc" placeholder="ادخل وصف المشكلة أو الاستفسار (إجباري)" class="w-full p-3 border rounded-lg h-32 outline-none focus:border-blue-500" required></textarea>

                    <button onclick="submitTicket()" id="submitBtn" class="w-full bg-green-600 text-white p-3 rounded-lg font-bold hover:bg-green-700 transition">تأكيد التيكت (Submit)</button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <span class="bg-orange-100 text-orange-600 p-2 rounded-full">🔍</span> بحث ومتابعة
                </h2>
                <div class="flex gap-2 mb-6">
                    <input type="tel" id="searchMobile" placeholder="ابحث برقم موبايل العميل..." class="flex-1 p-3 border rounded-lg outline-none focus:border-orange-400">
                    <button onclick="searchTickets()" class="bg-gray-800 text-white px-6 rounded-lg hover:bg-black transition">بحث</button>
                </div>

                <div id="searchResults" class="space-y-4 overflow-y-auto max-h-[500px] pr-2">
                    <p class="text-gray-400 text-center py-10">نتائج البحث هتظهر هنا..</p>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // استبدل ده ببيانات مشروعك من Firebase Console
        const firebaseConfig = {
            apiKey: "AIzaSyCn_Bg2B_bYyo1lqbiaIq9TZSvmeMWWaFY",
  authDomain: "my-ticketing-system-fef69.firebaseapp.com",
  projectId: "my-ticketing-system-fef69",
  storageBucket: "my-ticketing-system-fef69.firebasestorage.app",
  messagingSenderId: "180604352951",
  appId: "1:180604352951:web:54c10ac8d5f86cbe3a5032",
  measurementId: "G-F330HDVMJQ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentCategory = "طلب جديد";

        // مراقبة تسجيل الدخول
        onAuthStateChanged(auth, (user) => {
            if (user) {
                showPage('mainPage');
                document.getElementById('userDisp').innerText = user.email;
            } else {
                showPage('loginPage');
            }
        });

        window.setCategory = (cat) => {
            currentCategory = cat;
            document.getElementById('btnNew').className = cat === 'طلب جديد' ? 'flex-1 p-2 rounded-md font-bold transition bg-white shadow-sm text-blue-600' : 'flex-1 p-2 rounded-md font-bold transition text-gray-500';
            document.getElementById('btnInq').className = cat === 'استفسار' ? 'flex-1 p-2 rounded-md font-bold transition bg-white shadow-sm text-blue-600' : 'flex-1 p-2 rounded-md font-bold transition text-gray-500';
        };

        window.handleLogin = async () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            try { await signInWithEmailAndPassword(auth, email, pass); } 
            catch (e) { alert("خطأ في بيانات الدخول"); }
        };

        window.handleLogout = () => signOut(auth);

        window.submitTicket = async () => {
            const mobile = document.getElementById('custMobile').value;
            const subCat = document.getElementById('subCat').value;
            const branch = document.getElementById('branch').value;
            const desc = document.getElementById('desc').value;

            if(!mobile || !desc) return alert("من فضلك كمل البيانات");

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "جاري الحفظ...";

            try {
                await addDoc(collection(db, "tickets"), {
                    mobile,
                    category: currentCategory,
                    subCategory: subCat,
                    branch,
                    description: desc,
                    createdBy: auth.currentUser.email,
                    timestamp: serverTimestamp()
                });
                alert("تم تسجيل التيكت بنجاح");
                document.getElementById('custMobile').value = '';
                document.getElementById('desc').value = '';
            } catch (e) { alert("حدث خطأ"); }
            btn.disabled = false;
            btn.innerText = "تأكيد التيكت (Submit)";
        };

        window.searchTickets = async () => {
            const phone = document.getElementById('searchMobile').value;
            if(!phone) return;
            
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = "جاري البحث...";

            const q = query(collection(db, "tickets"), where("mobile", "==", phone), orderBy("timestamp", "desc"));
            const snapshot = await getDocs(q);
            
            resultsDiv.innerHTML = '';
            if(snapshot.empty) resultsDiv.innerHTML = '<p class="text-center text-red-400">مفيش تيكتات بالرقم ده</p>';

            snapshot.forEach(doc => {
                const data = doc.data();
                const date = data.timestamp?.toDate().toLocaleString('ar-EG') || 'جاري التحميل...';
                resultsDiv.innerHTML += `
                    <div class="border-r-4 border-blue-500 bg-blue-50 p-4 rounded-lg shadow-sm">
                        <div class="flex justify-between mb-2">
                            <span class="font-bold text-blue-800">${data.category} - ${data.subCategory}</span>
                            <span class="text-xs text-gray-500">${date}</span>
                        </div>
                        <p class="text-sm text-gray-700 mb-2">${data.description}</p>
                        <div class="flex justify-between text-[10px] text-gray-500 border-t pt-2">
                            <span>الفرع: ${data.branch}</span>
                            <span>بواسطة: ${data.createdBy}</span>
                        </div>
                    </div>
                `;
            });
        };

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }
    </script>
</body>
</html>
